<!--
  The site's only mark: the true-scale bar (§9). Four ticks it passes and one
  bright point at the bottom with no tick — the last pixel, where the withheld
  ten land and never passed. Drawn, not decorated: it is the same object the
  page spends four minutes filling.
-->

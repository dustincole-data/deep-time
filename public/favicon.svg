  <rect width="32" height="32" fill="#07090c" />
  <rect x="15" y="4" width="2" height="24" rx="1" fill="#f4f1ea" opacity="0.3" />
  <rect x="15" y="4" width="2" height="20" rx="1" fill="#f4f1ea" opacity="0.72" />
  <g fill="#f4f1ea" opacity="0.55">
    <rect x="11" y="8" width="4" height="1" />
    <rect x="11" y="14" width="4" height="1" />
    <rect x="11" y="20" width="4" height="1" />
  </g>
  <circle cx="16" cy="27" r="2.6" fill="#ffd9a0" />
</svg>
